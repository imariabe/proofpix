<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="diffSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a36"/>
      <stop offset="60%" stop-color="#144055"/>
      <stop offset="100%" stop-color="#1d5a64"/>
    </linearGradient>
    <clipPath id="diffLeft"><rect x="60" y="80" width="390" height="440" rx="18"/></clipPath>
    <clipPath id="diffRight"><rect x="450" y="80" width="390" height="440" rx="18"/></clipPath>
  </defs>

  <rect width="900" height="600" fill="#04060d"/>

  <!-- FILE A: photograph sliver -->
  <g clip-path="url(#diffLeft)">
    <rect x="60" y="80" width="390" height="440" fill="url(#diffSky)"/>
    <circle cx="368" cy="170" r="34" fill="#f4efe0" opacity="0.9"/>
    <g fill="#08111f">
      <rect x="60" y="360" width="90" height="160"/>
      <rect x="150" y="320" width="70" height="200"/>
      <rect x="220" y="380" width="100" height="140"/>
      <rect x="320" y="340" width="64" height="180"/>
      <rect x="384" y="372" width="66" height="148"/>
    </g>
    <g fill="#ffb454" opacity="0.85">
      <rect x="76" y="380" width="10" height="7" rx="2"/>
      <rect x="98" y="404" width="10" height="7" rx="2"/>
      <rect x="164" y="340" width="10" height="7" rx="2"/>
      <rect x="186" y="372" width="10" height="7" rx="2"/>
      <rect x="238" y="404" width="10" height="7" rx="2"/>
      <rect x="336" y="360" width="10" height="7" rx="2"/>
      <rect x="404" y="392" width="10" height="7" rx="2"/>
    </g>
  </g>
  <rect x="60" y="80" width="390" height="440" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- FILE B: difference map -->
  <g clip-path="url(#diffRight)">
    <rect x="450" y="80" width="390" height="440" fill="#02040a"/>
    <g fill="none" stroke="#4d8dff" stroke-opacity="0.7" stroke-width="2">
      <path d="M450 360 h90 v160"/>
      <path d="M540 320 h70 v200"/>
      <path d="M610 380 h100 v140"/>
      <path d="M710 340 h64 v180"/>
      <path d="M774 372 h66 v148"/>
    </g>
    <g fill="#ff9d3c" opacity="0.9">
      <rect x="556" y="336" width="12" height="9" rx="2"/>
      <rect x="578" y="368" width="12" height="9" rx="2"/>
      <rect x="642" y="404" width="14" height="10" rx="2"/>
      <rect x="744" y="356" width="12" height="9" rx="2"/>
    </g>
    <ellipse cx="640" cy="430" rx="120" ry="70" fill="#ff9d3c" fill-opacity="0.16"/>
    <g fill="#8fb2ff" opacity="0.75">
      <rect x="482" y="410" width="8" height="6" rx="2"/>
      <rect x="510" y="452" width="8" height="6" rx="2"/>
      <rect x="820" y="300" width="8" height="6" rx="2"/>
      <rect x="700" y="220" width="8" height="6" rx="2"/>
    </g>
  </g>
  <rect x="450" y="80" width="390" height="440" rx="18" fill="none" stroke="#4d8dff" stroke-opacity="0.35"/>

  <!-- seam handle -->
  <line x1="450" y1="80" x2="450" y2="520" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>
  <circle cx="450" cy="300" r="30" fill="#0a101f" stroke="#4d8dff" stroke-width="3"/>
  <g stroke="#8fb2ff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M442 290 l-10 10 l10 10"/>
    <path d="M458 290 l10 10 l-10 10"/>
  </g>

  <!-- labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="2">
    <text x="82" y="512" fill="#ffffff" fill-opacity="0.65">FILE A</text>
    <text x="738" y="512" fill="#8fb2ff">Δ MAP</text>
    <text x="60" y="566" fill="#ffffff" fill-opacity="0.4">MAE · RMSE · PSNR · CHANGED PIXELS</text>
  </g>
</svg>
